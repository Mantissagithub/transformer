<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kimi Delta Attention architecture</title>
  <desc id="desc">The KDA projections, channel-wise decay, delta-rule recurrent state, and gated output path.</desc>
  <rect width="1200" height="630" fill="#07090d"/>
  <text x="60" y="64" fill="#f5f7fa" font-family="monospace" font-size="31" font-weight="700">KIMI DELTA ATTENTION</text>
  <text x="60" y="94" fill="#8993a4" font-family="monospace" font-size="15">k3 bounded decay · exact recurrent reference · fixed-size state</text>

  <rect x="48" y="262" width="112" height="76" rx="12" fill="#121722" stroke="#586174" stroke-width="2"/>
  <text x="104" y="293" fill="#f5f7fa" font-family="monospace" font-size="18" text-anchor="middle">input</text>
  <text x="104" y="318" fill="#8993a4" font-family="monospace" font-size="14" text-anchor="middle">x_t in R^d</text>

  <g fill="#0e1b24" stroke="#42c8d8" stroke-width="2">
    <rect x="218" y="130" width="178" height="70" rx="12"/>
    <rect x="218" y="220" width="178" height="70" rx="12"/>
    <rect x="218" y="310" width="178" height="70" rx="12"/>
  </g>
  <g fill="#dffbff" font-family="monospace" font-size="16" text-anchor="middle">
    <text x="307" y="159">q projection</text><text x="307" y="182" fill="#79aab2" font-size="13">causal conv · silu · l2</text>
    <text x="307" y="249">k projection</text><text x="307" y="272" fill="#79aab2" font-size="13">causal conv · silu · l2</text>
    <text x="307" y="339">v projection</text><text x="307" y="362" fill="#79aab2" font-size="13">causal conv · silu</text>
  </g>

  <g fill="#20180e" stroke="#f3a84b" stroke-width="2">
    <rect x="218" y="414" width="178" height="70" rx="12"/>
    <rect x="444" y="414" width="178" height="70" rx="12"/>
  </g>
  <g fill="#fff0d8" font-family="monospace" font-size="16" text-anchor="middle">
    <text x="307" y="443">low-rank decay</text><text x="307" y="466" fill="#c9995d" font-size="10">z_t = w_up w_down x_t + b</text>
    <text x="533" y="443">bounded gate</text><text x="533" y="466" fill="#c9995d" font-size="10">g_t = -5 sigmoid(exp(a) z_t)</text>
  </g>

  <rect x="444" y="310" width="178" height="70" rx="12" fill="#20180e" stroke="#f3a84b" stroke-width="2"/>
  <text x="533" y="339" fill="#fff0d8" font-family="monospace" font-size="16" text-anchor="middle">write strength</text>
  <text x="533" y="362" fill="#c9995d" font-family="monospace" font-size="10" text-anchor="middle">beta_t = sigmoid(w_beta x_t)</text>

  <rect x="682" y="190" width="254" height="230" rx="18" fill="#111b16" stroke="#64d88b" stroke-width="2.5"/>
  <text x="809" y="229" fill="#e8fff0" font-family="monospace" font-size="19" text-anchor="middle">delta-rule memory</text>
  <text x="809" y="264" fill="#8bcda1" font-family="monospace" font-size="14" text-anchor="middle">s_(t-1) in R^(dk x dv)</text>
  <line x1="716" y1="283" x2="902" y2="283" stroke="#365f45"/>
  <text x="809" y="316" fill="#d9f8e3" font-family="monospace" font-size="13" text-anchor="middle">s_bar = alpha_t * s_(t-1)</text>
  <text x="809" y="345" fill="#d9f8e3" font-family="monospace" font-size="13" text-anchor="middle">e = v_t - s_bar^T k_t</text>
  <text x="809" y="374" fill="#d9f8e3" font-family="monospace" font-size="12" text-anchor="middle">s_t = s_bar + beta_t k_t e^T</text>
  <text x="809" y="403" fill="#91d9aa" font-family="monospace" font-size="13" text-anchor="middle">o_t = s_t^T q_t / sqrt(dk)</text>

  <rect x="990" y="190" width="164" height="104" rx="14" fill="#171422" stroke="#ac87ee" stroke-width="2"/>
  <text x="1072" y="224" fill="#f1eaff" font-family="monospace" font-size="15" text-anchor="middle">head rmsnorm</text>
  <text x="1072" y="250" fill="#bba8dc" font-family="monospace" font-size="13" text-anchor="middle">* sigmoid(w_g x_t)</text>
  <text x="1072" y="276" fill="#bba8dc" font-family="monospace" font-size="13" text-anchor="middle">full-rank gate</text>
  <rect x="990" y="326" width="164" height="70" rx="14" fill="#171422" stroke="#ac87ee" stroke-width="2"/>
  <text x="1072" y="357" fill="#f1eaff" font-family="monospace" font-size="15" text-anchor="middle">output projection</text>
  <text x="1072" y="380" fill="#bba8dc" font-family="monospace" font-size="13" text-anchor="middle">y_t = w_o(...)</text>

  <g fill="none" stroke="#586174" stroke-width="2">
    <path d="M160 300 H188 V165 H218"/>
    <path d="M188 255 H218"/>
    <path d="M188 345 H218"/>
    <path d="M160 315 H188 V449 H218"/>
    <path d="M396 449 H444"/>
    <path d="M396 345 H444"/>
  </g>
  <g fill="none" stroke="#64d88b" stroke-width="2.5">
    <path d="M396 165 H642 V238 H682"/>
    <path d="M396 255 H658 V290 H682"/>
    <path d="M396 345 H658 V342 H682"/>
    <path d="M622 345 H682"/>
    <path d="M622 449 H650 V390 H682"/>
    <path d="M936 242 H990"/>
    <path d="M1072 294 V326"/>
  </g>
  <g fill="#64d88b">
    <path d="M682 238 l-9 -5 v10 z"/><path d="M682 290 l-9 -5 v10 z"/><path d="M682 342 l-9 -5 v10 z"/>
    <path d="M682 390 l-9 -5 v10 z"/><path d="M990 242 l-9 -5 v10 z"/><path d="M1072 326 l-5 -9 h10 z"/>
  </g>

  <rect x="48" y="538" width="1106" height="54" rx="12" fill="#10141c" stroke="#293142"/>
  <text x="70" y="571" fill="#aeb7c7" font-family="monospace" font-size="15">decode cache:</text>
  <text x="218" y="571" fill="#64d88b" font-family="monospace" font-size="15">one fixed state per head</text>
  <text x="484" y="571" fill="#8993a4" font-family="monospace" font-size="15">+</text>
  <text x="512" y="571" fill="#42c8d8" font-family="monospace" font-size="15">three bounded conv tails</text>
  <text x="800" y="571" fill="#8993a4" font-family="monospace" font-size="15">no growing token kv cache</text>
</svg>
