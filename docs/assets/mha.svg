<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2060 940" role="img" aria-label="multi-head attention architecture diagram">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
    <path d="M0,0 L0,8 L12,4 z" fill="#aaa287"/>
