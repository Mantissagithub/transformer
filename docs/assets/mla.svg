<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2420 970" role="img" aria-label="multi-head latent attention architecture diagram">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
    <path d="M0,0 L0,8 L12,4 z" fill="#aaa287"/>
  </marker>
  <pattern id="matrix" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect width="16" height="16" fill="#008b96"/>
    <rect x="2" width="2" height="16" fill="#00ffee" opacity=".12"/>
    <rect x="10" width="2" height="16" fill="#004e70" opacity=".18"/>
  </pattern>
  <pattern id="latentPattern" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#006f7d"/>
    <rect x="2" width="2" height="14" fill="#00f0d0" opacity=".13"/>
    <rect x="9" width="2" height="14" fill="#003c66" opacity=".18"/>
  </pattern>
  <style>
  .title { fill: #f2ecd3; font-size: 28px; font-weight: 700; }
  .section { fill: #9f967c; font-size: 16px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
  .label { fill: #e8dfc2; font-size: 16px; font-weight: 700; }
  .small { fill: #9b9278; font-size: 13px; }
  .math { fill: #fff6d8; font-family: "Times New Roman", serif; font-style: italic; font-size: 24px; }
  .box { fill: #070707; stroke: #9b9278; stroke-width: 2.5; rx: 10; }
  .tensor { fill: #007f8f; stroke: #00d7de; stroke-width: 1.6; rx: 5; }
  .latent { fill: #053a46; stroke: #00d7de; stroke-width: 1.7; rx: 5; }
  .proj { fill: #151005; stroke: #c7b46a; stroke-width: 2.3; rx: 10; }
  .cache { fill: #061b14; stroke: #43e08a; stroke-width: 2.2; rx: 10; }
  .attn { fill: #260044; stroke: #a16dff; stroke-width: 1.9; rx: 8; }
  .local { fill: #041f18; stroke: #43e08a; stroke-width: 2; rx: 8; }
  .compress { fill: #1b1605; stroke: #ffd45a; stroke-width: 2; rx: 8; }
  .head1 { fill: #003f46; stroke: #00e0d4; }
  .head2 { fill: #1f0c45; stroke: #a16dff; }
  .head3 { fill: #332400; stroke: #ffd45a; }
  .headh { fill: #052b1d; stroke: #43e08a; }
  .arrow { fill: none; stroke: #aaa287; stroke-width: 2.8; marker-end: url(#arrow); }
  .thin { stroke-width: 2; opacity: .85; }
</style>
</defs>
<rect width="2420" height="970" fill="#050505"/>
<text class="title" x="70" y="70">multi-head latent attention</text>
<text class="small" x="72" y="98">mla compresses keys/values into a shared latent cache, then reconstructs per-head k/v views during attention</text>
<text class="section" x="90" y="155">input</text>
  <rect x="95" y="360" width="105" height="250" fill="url(#matrix)" stroke="#00d7de" stroke-width="2"/>
  <text class="math" x="130" y="645">X</text>
  <text class="small" x="100" y="668">n x d_model</text>
  <text class="label" x="35" y="390">the</text>
  <text class="label" x="20" y="425">american</text>
  <text class="label" x="55" y="460">flag</text>
  <text class="label" x="70" y="495">is</text>
  <text class="label" x="58" y="530">red</text>
  <text class="label" x="75" y="565">...</text>
<text class="section" x="325" y="155">query path</text>
<text class="section" x="325" y="575">latent kv path</text>
<text class="section" x="760" y="155">per-head query views</text>
<text class="section" x="760" y="575">shared latent cache</text>
<text class="section" x="1120" y="155">attention using latent kv</text>
<text class="section" x="1570" y="155">merge heads</text>
<rect class="proj" x="315" y="245" width="160" height="80" />
<text class="math" x="340" y="292">W<tspan baseline-shift="-35%" font-size="15">DQ</tspan></text>
<text class="small" x="335" y="314">query down-proj</text>
<rect class="proj" x="315" y="665" width="160" height="80" />
<text class="math" x="340" y="712">W<tspan baseline-shift="-35%" font-size="15">DKV</tspan></text>
<text class="small" x="335" y="734">kv down-proj</text>
<path class="arrow" d="M200 430 C265 430 250 285 315 285"/>
<path class="arrow" d="M200 545 C265 545 250 705 315 705"/>
<rect class="latent" x="555" y="230" width="210" height="110" fill="url(#latentPattern)"/>
<text class="math" x="618" y="288">c<tspan baseline-shift="-35%" font-size="15">Q</tspan></text>
<text class="small" x="600" y="360">n x d_cq</text>
<text class="small" x="570" y="215">compressed query latent</text>
<path class="arrow" d="M475 285 L555 285"/>
<rect class="cache" x="555" y="635" width="250" height="140" fill="url(#latentPattern)"/>
<text class="math" x="630" y="705">c<tspan baseline-shift="-35%" font-size="15">KV</tspan></text>
<text class="small" x="620" y="795">n x d_ckv</text>
<text class="small" x="570" y="620">compressed shared kv latent</text>
<text class="label" x="590" y="735">cached during decoding</text>
<path class="arrow" d="M475 705 L555 705"/>
<rect class="proj" x="835" y="245" width="155" height="80" />
<text class="math" x="858" y="292">W<tspan baseline-shift="-35%" font-size="15">UQ</tspan></text>
<text class="small" x="852" y="314">query up-proj</text>
<path class="arrow" d="M765 285 L835 285"/>
<rect class="proj" x="850" y="665" width="170" height="80" />
<text class="math" x="875" y="712">W<tspan baseline-shift="-35%" font-size="15">UK,UV</tspan></text>
<text class="small" x="870" y="734">per-head views</text>
<path class="arrow" d="M805 705 L850 705"/>
<rect class="box" x="1065" y="205" width="260" height="92" />
<text class="label" x="1085" y="235">head 1 query</text>
<text class="math" x="1185" y="265">q₁</text>
<rect class="box" x="1065" y="320" width="260" height="92" />
<text class="label" x="1085" y="350">head 2 query</text>
<text class="math" x="1185" y="380">q₂</text>
<rect class="box" x="1065" y="435" width="260" height="92" />
<text class="label" x="1085" y="465">head h query</text>
<text class="math" x="1185" y="495">qₕ</text>
<path class="arrow thin" d="M990 285 C1025 285 1025 250 1065 250"/>
<path class="arrow thin" d="M990 285 C1030 285 1025 365 1065 365"/>
<path class="arrow thin" d="M990 285 C1030 285 1025 480 1065 480"/>
<rect class="box" x="1065" y="635" width="285" height="150" />
<text class="label" x="1085" y="665">reconstruct k/v views</text>
<text class="math" x="1085" y="705">kᵢ = c<tspan baseline-shift="-35%" font-size="15">KV</tspan>W<tspan baseline-shift="-35%" font-size="15">UK,i</tspan></text>
<text class="math" x="1085" y="742">vᵢ = c<tspan baseline-shift="-35%" font-size="15">KV</tspan>W<tspan baseline-shift="-35%" font-size="15">UV,i</tspan></text>
<text class="small" x="1085" y="770">shared latent cache, different per-head projections</text>
<path class="arrow" d="M1020 705 L1065 705"/>
<rect class="attn" x="1395" y="210" width="260" height="100" />
<text class="label" x="1415" y="240">head 1 attention</text>
<text class="math" x="1415" y="275">A = softmax(qkᵀ / √d)</text>
<rect class="attn" x="1395" y="350" width="260" height="100" />
<text class="label" x="1415" y="380">head 2 attention</text>
<text class="math" x="1415" y="415">A = softmax(qkᵀ / √d)</text>
<rect class="attn" x="1395" y="490" width="260" height="100" />
<text class="label" x="1415" y="520">head h attention</text>
<text class="math" x="1415" y="555">A = softmax(qkᵀ / √d)</text>
