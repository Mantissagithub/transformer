  .attn { fill: #260044; stroke: #a16dff; stroke-width: 1.9; rx: 8; }
  .local { fill: #041f18; stroke: #43e08a; stroke-width: 2; rx: 8; }
  .compress { fill: #1b1605; stroke: #ffd45a; stroke-width: 2; rx: 8; }
  .head1 { fill: #003f46; stroke: #00e0d4; }
  .head2 { fill: #1f0c45; stroke: #a16dff; }
