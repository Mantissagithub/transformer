<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 940" role="img" aria-label="compressed sparse attention architecture diagram">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
    <path d="M0,0 L0,8 L12,4 z" fill="#aaa287"/>
  </marker>
  <pattern id="matrix" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect width="16" height="16" fill="#008b96"/>
    <rect x="2" width="2" height="16" fill="#00ffee" opacity=".12"/>
    <rect x="10" width="2" height="16" fill="#004e70" opacity=".18"/>
  </pattern>
  <pattern id="latentPattern" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#006f7d"/>
    <rect x="2" width="2" height="14" fill="#00f0d0" opacity=".13"/>
    <rect x="9" width="2" height="14" fill="#003c66" opacity=".18"/>
  </pattern>
  <style>
  .title { fill: #f2ecd3; font-size: 28px; font-weight: 700; }
  .section { fill: #9f967c; font-size: 16px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
  .label { fill: #e8dfc2; font-size: 16px; font-weight: 700; }
  .small { fill: #9b9278; font-size: 13px; }
  .math { fill: #fff6d8; font-family: "Times New Roman", serif; font-style: italic; font-size: 24px; }
  .box { fill: #070707; stroke: #9b9278; stroke-width: 2.5; rx: 10; }
  .tensor { fill: #007f8f; stroke: #00d7de; stroke-width: 1.6; rx: 5; }
  .latent { fill: #053a46; stroke: #00d7de; stroke-width: 1.7; rx: 5; }
  .proj { fill: #151005; stroke: #c7b46a; stroke-width: 2.3; rx: 10; }
  .cache { fill: #061b14; stroke: #43e08a; stroke-width: 2.2; rx: 10; }
  .attn { fill: #260044; stroke: #a16dff; stroke-width: 1.9; rx: 8; }
  .local { fill: #041f18; stroke: #43e08a; stroke-width: 2; rx: 8; }
  .compress { fill: #1b1605; stroke: #ffd45a; stroke-width: 2; rx: 8; }
  .head1 { fill: #003f46; stroke: #00e0d4; }
  .head2 { fill: #1f0c45; stroke: #a16dff; }
  .head3 { fill: #332400; stroke: #ffd45a; }
  .headh { fill: #052b1d; stroke: #43e08a; }
  .arrow { fill: none; stroke: #aaa287; stroke-width: 2.8; marker-end: url(#arrow); }
  .thin { stroke-width: 2; opacity: .85; }
</style>
</defs>
<rect width="1900" height="940" fill="#050505"/>
<text class="title" x="70" y="70">compressed sparse attention</text>
<text class="small" x="72" y="98">compress long-range kv blocks, select top-k memory, and keep a recent local branch</text>
<text class="section" x="90" y="155">input</text>
  <rect x="95" y="360" width="105" height="250" fill="url(#matrix)" stroke="#00d7de" stroke-width="2"/>
  <text class="math" x="130" y="645">X</text>
  <text class="small" x="100" y="668">n x d_model</text>
  <text class="label" x="35" y="390">the</text>
  <text class="label" x="20" y="425">american</text>
  <text class="label" x="55" y="460">flag</text>
  <text class="label" x="70" y="495">is</text>
  <text class="label" x="58" y="530">red</text>
  <text class="label" x="75" y="565">...</text>
<text class="section" x="330" y="155">compression</text>
<text class="section" x="680" y="155">indexer</text>
<text class="section" x="1040" y="155">selected memory</text>
<text class="section" x="1450" y="155">attention</text>
<rect class="compress" x="315" y="220" width="230" height="110" />
<text class="label" x="339" y="256">dual-stream compression</text>
<text class="small" x="339" y="284">overlapping A/B blocks</text>
<rect class="compress" x="315" y="390" width="230" height="110" />
<text class="label" x="339" y="426">local window branch</text>
<text class="small" x="339" y="454">recent uncompressed KV</text>
<path class="arrow" d="M200 440 C260 440 250 275 315 275"/>
<path class="arrow" d="M200 535 C260 535 250 445 315 445"/>
<rect class="latent" x="650" y="220" width="230" height="110" />
<text class="label" x="674" y="256">compressed KV pool</text>
<text class="small" x="674" y="284">one entry per block</text>
<rect class="proj" x="650" y="390" width="230" height="110" />
<text class="label" x="674" y="426">lightning indexer</text>
<text class="small" x="674" y="454">score compressed blocks</text>
<path class="arrow" d="M545 275 L650 275"/>
<path class="arrow" d="M545 445 L650 445"/>
<g transform="translate(930,250)"><rect width="70" height="70" fill="#300050"/>
<rect x="0" y="0" width="14" height="14" fill="#f8e71c"/>
<rect x="14" y="14" width="14" height="14" fill="#20d670"/>
<rect x="28" y="28" width="14" height="14" fill="#00b7d8"/>
<rect x="42" y="42" width="14" height="14" fill="#6130d2"/>
<rect x="56" y="56" width="14" height="14" fill="#f8e71c"/>
<rect x="0" y="42" width="14" height="14" fill="#00a6ad"/>
<rect x="14" y="56" width="14" height="14" fill="#39d174"/>
<rect x="42" y="14" width="14" height="14" fill="#2d6fe0"/>
<rect x="56" y="28" width="14" height="14" fill="#f8e71c"/>
</g>
<text class="small" x="920" y="345">top-k compressed blocks</text>
<g transform="translate(930,430)"><rect width="70" height="70" fill="#300050"/>
<rect x="0" y="0" width="14" height="14" fill="#f8e71c"/>
<rect x="14" y="14" width="14" height="14" fill="#20d670"/>
<rect x="28" y="28" width="14" height="14" fill="#00b7d8"/>
<rect x="42" y="42" width="14" height="14" fill="#6130d2"/>
<rect x="56" y="56" width="14" height="14" fill="#f8e71c"/>
<rect x="0" y="14" width="14" height="14" fill="#1bd2aa"/>
<rect x="14" y="0" width="14" height="14" fill="#00a6ad"/>
<rect x="28" y="14" width="14" height="14" fill="#2d6fe0"/>
<rect x="42" y="28" width="14" height="14" fill="#5a2bc6"/>
</g>
<text class="small" x="920" y="525">recent local window</text>
<path class="arrow" d="M880 275 L930 285"/>
<path class="arrow" d="M880 445 L930 465"/>
<rect class="attn" x="1180" y="300" width="260" height="130" />
<text class="label" x="1204" y="336">shared-kv mqa</text>
<text class="small" x="1204" y="364">selected compressed + local KV</text>
<path class="arrow" d="M1000 285 C1090 285 1080 340 1180 340"/>
<path class="arrow" d="M1000 465 C1090 465 1080 390 1180 390"/>
<rect class="proj" x="1510" y="330" width="180" height="90" />
<text class="label" x="1534" y="366">grouped output</text>
<text class="small" x="1534" y="394">project heads back</text>
<path class="arrow" d="M1440 365 L1510 375"/>
<rect class="tensor" x="1740" y="325" width="120" height="100" />
<text class="label" x="1764" y="361">O</text>
<text class="small" x="1764" y="389">n x d_model</text>
<path class="arrow" d="M1690 375 L1740 375"/>
<rect x="110" y="805" width="1580" height="70" rx="14" fill="#080808" stroke="#3a3427" stroke-width="1.5"/>
<text class="math" x="150" y="850">CSA(X) = grouped_output(attend(top_k(compressed_KV), local_window_KV))</text>
</svg>
