[project]
name = "lean-starcoder-sft"
version = "0.1.0"
description = "Two-phase Lean syntax and proof SFT pipeline for StarCoderBase-1B."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "accelerate",
    "datasets",
    "huggingface-hub",
    "peft",
    "python-dotenv",
    "pyyaml",
    "requests",
    "rich",
    "tensorboard",
    "torch",
    "tqdm",
    "transformers",
    "trl",
]

[project.optional-dependencies]
dev = ["pytest"]
quant = ["bitsandbytes"]

[project.scripts]
lean-sft-generate = "lean_sft.generate_dataset:main"
lean-sft-validate = "lean_sft.validate_dataset:main"
lean-sft-push-data = "lean_sft.push_dataset:main"
lean-sft-train = "lean_sft.train:main"
lean-sft-benchmark = "lean_sft.benchmark:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lean_sft*"]
